# Site settings
title: CIS352
baseurl: "/cis352-s26"
url: "https://kmicinski.com/"
description: "CMSC352--Principles of Programming Languages (Spring '26) at Syracuse"
permalink: pretty

# Build settings
#markdown: redcarpet

# Build posts to appear in the future
future: true

exclude:
  - proof-checker
  - lecture-projects/stlc-intrinsic
  - lecture-projects/stlc-lean
  - lecture-projects/rust-slides/node_modules
  - lecture-projects/rust-slides/package.json
  - lecture-projects/rust-slides/package-lock.json
  - lecture-projects/rust-slides/README.md
  - lecture-projects/rust-slides/.gitignore
  - Gemfile
  - Gemfile.lock

defaults:
  - scope:
      path: "assets/img"
    values:
      image: true
